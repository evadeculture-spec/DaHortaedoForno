  <a class="salto" href="#conteudo" data-salto>Saltar para o conteúdo</a>

  <header class="cab" data-cab>
    <div class="cab__topo">
      <div class="cab__barra wrap">
        <button class="cab__menu-btn icone-btn" type="button" aria-expanded="false" aria-controls="painel-menu" data-abrir-menu>
          <svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg><span class="sr-only">Abrir menu</span>
        </button>
        <a class="marca" href="/" aria-label="Da Horta e do Forno — início">
          <img class="marca__lockup" src="assets/brand/logotipo-horizontal.svg" width="474" height="124" alt="Da Horta e do Forno">
          <img class="marca__simbolo" src="assets/brand/simbolo.svg" width="427" height="325" alt="">
        </a>
        <div class="cab__pesquisa" data-pesquisa-topo></div>
        <div class="cab__acoes">
          <button class="icone-btn cab__lupa" type="button" data-abrir-pesquisa aria-haspopup="dialog">
            <svg class="icon" aria-hidden="true"><use href="#i-lupa"/></svg><span class="sr-only">Pesquisar</span>
          </button>
          <a class="cab__acao cab__conta" href="/conta">
            <svg class="icon" aria-hidden="true"><use href="#i-pessoa"/></svg><span class="cab__acao-txt">Conta</span>
          </a>
          <a class="cab__acao" href="/favoritos">
            <svg class="icon" aria-hidden="true"><use href="#i-coracao"/></svg><span class="cab__acao-txt">Favoritos</span><span class="contador" data-num-fav hidden>0</span>
          </a>
          <button class="cab__cesto" type="button" data-abrir-cesto data-cesto-botao aria-haspopup="dialog">
            <span class="cab__cesto-icone" aria-hidden="true"><svg class="icon"><use href="#i-cesto"/></svg></span>
            <span class="cab__cesto-txt">Cesto</span>
            <span class="cab__cesto-num">(<span data-num-cesto>0</span>)</span>
          </button>
        </div>
      </div>
    </div>
    <nav class="cab__nav" aria-label="Principal" data-nav></nav>
  </header>

  <main id="conteudo" class="app" tabindex="-1" data-app></main>

  <footer class="rodape" data-rodape></footer>

  <!-- Menu do telemóvel/tablet: painel com níveis -->
  <dialog class="painel painel--esq" id="painel-menu" aria-labelledby="painel-menu-titulo" data-painel-menu></dialog>
  <!-- Pesquisa no telemóvel/tablet -->
  <dialog class="painel painel--topo" id="painel-pesquisa" aria-label="Pesquisar no mercado" data-painel-pesquisa></dialog>
  <!-- Cesto -->
  <dialog class="painel painel--dir gaveta" id="cesto" aria-labelledby="cesto-titulo" data-gaveta-cesto></dialog>
  <!-- Confirmações -->
  <dialog class="confirmar" id="confirmar" aria-labelledby="confirmar-titulo" data-confirmar></dialog>

  <div class="toast" data-toast role="status" hidden></div>
  <div class="sr-only" aria-live="polite" aria-atomic="true" data-anuncio></div>
