# Site estático, sem dependências. O comando de build só valida o catálogo e as ligações
# (72 produtos, bancas, produtores, receitas, cabazes e imagens) antes de publicar.
[build]
  publish = "."
  command = "node tools/verificar-catalogo.mjs"

# Caminhos legíveis (/mercado/padaria, /produto/broa-de-milho…): ficheiros existentes são
# servidos tal como estão; qualquer outro caminho devolve a aplicação.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
