# Site estático, sem dependências e sem passo de build: a raiz é publicada tal como está.
# A validação do catálogo corre localmente com `npm run build` (ver README).
[build]
  publish = "."
  command = ""

# Caminhos legíveis (/mercado/padaria, /produto/broa-de-milho…): ficheiros existentes são
# servidos tal como estão; qualquer outro caminho devolve a aplicação.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
